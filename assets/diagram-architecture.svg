<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <!-- Background & Node Gradients -->
    <radialGradient id="archBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#140f2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="storageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowLine {
      to { stroke-dashoffset: -40; }
    }
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.02); opacity: 1; }
    }
    .flow-path {
      stroke-dasharray: 8 8;
      animation: flowLine 1.5s linear infinite;
    }
    .flow-path-fast {
      stroke-dasharray: 6 6;
      animation: flowLine 0.9s linear infinite;
    }
    .text-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1100" height="580" fill="url(#archBg)" rx="16" stroke="#28224d" stroke-width="2"/>

  <!-- Diagram Title -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#ffffff" font-size="22" class="text-sans" font-weight="800">
      SYSTEM ARCHITECTURE &amp; DATA CONTROL PLANE
    </text>
    <text x="0" y="22" fill="#94a3b8" font-size="12" class="text-mono">
      Decoupled Modular Monolith • Real DB Persistence • Asynchronous Worker Pool
    </text>
  </g>

  <!-- Connecting Animated Data Pipes -->
  <g fill="none" stroke-width="2.5">
    <!-- Client to API -->
    <path d="M 230 200 L 340 200" stroke="#60a5fa" class="flow-path"/>
    <!-- API to DB -->
    <path d="M 460 140 L 460 90 L 740 90 L 740 140" stroke="#34d399" class="flow-path"/>
    <!-- API to Dispatcher -->
    <path d="M 460 260 L 460 360" stroke="#c084fc" class="flow-path"/>
    <!-- Dispatcher to Workers -->
    <path d="M 580 380 L 680 250" stroke="#f472b6" class="flow-path"/>
    <path d="M 580 400 L 680 380" stroke="#f472b6" class="flow-path"/>
    <path d="M 580 420 L 680 500" stroke="#f472b6" class="flow-path"/>
    <!-- Workers to Storage Vault -->
    <path d="M 910 250 L 980 320" stroke="#fbbf24" class="flow-path-fast"/>
    <path d="M 910 380 L 980 380" stroke="#fbbf24" class="flow-path-fast"/>
    <path d="M 910 500 L 980 430" stroke="#fbbf24" class="flow-path-fast"/>
  </g>

  <!-- 1. CLIENT PLANE -->
  <g transform="translate(40, 140)">
    <rect width="190" height="230" rx="14" fill="#120e26" stroke="#3b82f6" stroke-width="1.8" filter="url(#glowEffect)"/>
    <rect width="190" height="38" rx="14" fill="url(#clientGrad)"/>
    <text x="95" y="24" fill="#ffffff" font-size="13" class="text-sans" font-weight="700" text-anchor="middle">CLIENT PLANE</text>
    
    <g transform="translate(15, 60)" class="text-mono" font-size="11" fill="#cbd5e1">
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1c163b" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="80" y="21" text-anchor="middle">Responsive Web UI</text>

      <rect x="0" y="44" width="160" height="34" rx="8" fill="#1c163b" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="80" y="65" text-anchor="middle">TypeScript API Client</text>

      <rect x="0" y="88" width="160" height="34" rx="8" fill="#1c163b" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="80" y="109" text-anchor="middle">Zero-Trust Previews</text>
      
      <rect x="0" y="132" width="160" height="26" rx="6" fill="#0b2847"/>
      <text x="80" y="149" fill="#60a5fa" text-anchor="middle" font-size="10">Direct S3 / Vault Download</text>
    </g>
  </g>

  <!-- 2. APPLICATION API (FastAPI) -->
  <g transform="translate(340, 140)">
    <rect width="240" height="120" rx="14" fill="#171133" stroke="#8b5cf6" stroke-width="2" filter="url(#glowEffect)"/>
    <rect width="240" height="36" rx="14" fill="url(#apiGrad)"/>
    <text x="120" y="24" fill="#ffffff" font-size="13" class="text-sans" font-weight="700" text-anchor="middle">FASTAPI MODULAR API</text>
    
    <g transform="translate(16, 52)" class="text-mono" font-size="11" fill="#e2e8f0">
      <text x="0" y="15">• /api/v1/uploads (Sniff &amp; Hash)</text>
      <text x="0" y="35">• /api/v1/jobs (Idempotent)</text>
      <text x="0" y="55">• /api/v1/stats (DB Aggregation)</text>
    </g>
  </g>

  <!-- 3. REAL RELATIONAL DATABASE -->
  <g transform="translate(680, 70)">
    <rect width="240" height="120" rx="14" fill="#0d1f1a" stroke="#10b981" stroke-width="2" filter="url(#glowEffect)"/>
    <rect width="240" height="36" rx="14" fill="url(#dbGrad)"/>
    <text x="120" y="24" fill="#ffffff" font-size="13" class="text-sans" font-weight="700" text-anchor="middle">REAL RELATIONAL DATABASE</text>
    
    <g transform="translate(16, 52)" class="text-mono" font-size="11" fill="#a7f3d0">
      <text x="0" y="15">• SQLite (WAL Mode) / Postgres</text>
      <text x="0" y="35">• jobs, file_assets, artifacts</text>
      <text x="0" y="55">• Atomic Ledgers &amp; Audit Logs</text>
    </g>
  </g>

  <!-- 4. JOB DISPATCHER & ASYNC QUEUE -->
  <g transform="translate(340, 340)">
    <rect width="240" height="140" rx="14" fill="#1c1236" stroke="#c084fc" stroke-width="1.8"/>
    <rect width="240" height="36" rx="14" fill="#4c1d95"/>
    <text x="120" y="24" fill="#ffffff" font-size="13" class="text-sans" font-weight="700" text-anchor="middle">ASYNC JOB DISPATCHER</text>
    
    <g transform="translate(16, 54)" class="text-mono" font-size="11" fill="#e9d5ff">
      <text x="0" y="15">• ThreadPoolExecutor (Workers)</text>
      <text x="0" y="35">• Realtime DB State Updates</text>
      <text x="0" y="55">• Cancellation Signal Polling</text>
      <text x="0" y="75">• Automatic Retry &amp; Backoff</text>
    </g>
  </g>

  <!-- 5. DEDICATED WORKER ENGINES -->
  <g transform="translate(680, 220)">
    <!-- Image Worker -->
    <g transform="translate(0, 0)">
      <rect width="230" height="75" rx="12" fill="#1c122b" stroke="#ec4899" stroke-width="1.5"/>
      <rect width="230" height="26" rx="12" fill="url(#workerGrad)"/>
      <text x="115" y="18" fill="#ffffff" font-size="11" class="text-sans" font-weight="700" text-anchor="middle">IMAGE WORKER (Pillow)</text>
      <text x="12" y="46" fill="#fbcfe8" font-size="10" class="text-mono">Compress • Resize • Lanczos</text>
      <text x="12" y="62" fill="#f472b6" font-size="10" class="text-mono">Auto EXIF Transpose &amp; Strip</text>
    </g>

    <!-- PDF Worker -->
    <g transform="translate(0, 125)">
      <rect width="230" height="75" rx="12" fill="#1c122b" stroke="#ec4899" stroke-width="1.5"/>
      <rect width="230" height="26" rx="12" fill="url(#workerGrad)"/>
      <text x="115" y="18" fill="#ffffff" font-size="11" class="text-sans" font-weight="700" text-anchor="middle">PDF WORKER (PyMuPDF)</text>
      <text x="12" y="46" fill="#fbcfe8" font-size="10" class="text-mono">Deflate • Screen/Balanced DPI</text>
      <text x="12" y="62" fill="#f472b6" font-size="10" class="text-mono">Merge • Split • Rotate • XREFs</text>
    </g>

    <!-- Video Worker -->
    <g transform="translate(0, 250)">
      <rect width="230" height="75" rx="12" fill="#1c122b" stroke="#ec4899" stroke-width="1.5"/>
      <rect width="230" height="26" rx="12" fill="url(#workerGrad)"/>
      <text x="115" y="18" fill="#ffffff" font-size="11" class="text-sans" font-weight="700" text-anchor="middle">VIDEO WORKER (FFmpeg v7.1)</text>
      <text x="12" y="46" fill="#fbcfe8" font-size="10" class="text-mono">H.264 / AAC MP4 • Safe Args</text>
      <text x="12" y="62" fill="#f472b6" font-size="10" class="text-mono">Probe • FastStart • Timed Kill</text>
    </g>
  </g>

  <!-- 6. SANDBOXED STORAGE VAULT -->
  <g transform="translate(970, 270)">
    <rect width="100" height="230" rx="14" fill="#24160a" stroke="#f59e0b" stroke-width="2" filter="url(#glowEffect)"/>
    <rect width="100" height="34" rx="14" fill="url(#storageGrad)"/>
    <text x="50" y="22" fill="#ffffff" font-size="11" class="text-sans" font-weight="700" text-anchor="middle">STORAGE</text>
    
    <g transform="translate(10, 50)" class="text-mono" font-size="9" fill="#fde68a">
      <text x="0" y="15">quarantine/</text>
      <text x="0" y="35">inputs/</text>
      <text x="0" y="55">artifacts/</text>
      <text x="0" y="75">temp/</text>
      <line x1="0" y1="90" x2="80" y2="90" stroke="#f59e0b" stroke-width="0.8"/>
      <text x="0" y="110">SHA-256</text>
      <text x="0" y="130">Non-Root</text>
      <text x="0" y="150">Path Safe</text>
    </g>
  </g>
</svg>
