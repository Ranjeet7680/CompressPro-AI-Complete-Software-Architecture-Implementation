<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="heroGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070510" stop-opacity="1"/>
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191336" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0d0a1c" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ddd6fe"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { x: -600; }
      100% { x: 1200; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .laser-beam {
      animation: laserSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulsing-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
    .font-mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="380" fill="#080612" rx="16"/>
  <rect width="1200" height="380" fill="url(#heroGlow)" rx="16"/>

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.08" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="750" y1="0" x2="750" y2="380"/>
    <line x1="900" y1="0" x2="900" y2="380"/>
    <line x1="1050" y1="0" x2="1050" y2="380"/>
  </g>

  <!-- Canvas Outer Neon Border -->
  <rect x="2" y="2" width="1196" height="376" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" opacity="0.7"/>

  <!-- Top Laser Beam -->
  <rect x="0" y="2" width="500" height="3" fill="url(#laserGrad)" class="laser-beam"/>

  <!-- LEFT COLUMN: BRANDING & SPECIFICATIONS (Clean, absolute coordinates x=60) -->
  <g>
    <!-- Top Pill: Status -->
    <rect x="60" y="48" width="310" height="30" rx="15" fill="#171233" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="76" cy="63" r="4.5" fill="#10b981" filter="url(#neon)" class="pulsing-dot"/>
    <text x="88" y="68" fill="#c4b5fd" font-size="11.5" class="font-mono" font-weight="600" letter-spacing="0.5">
      PRODUCTION BASELINE • V1.0 ACTIVE
    </text>

    <!-- Main Title -->
    <text x="60" y="142" fill="url(#titleGrad)" font-size="52" class="font-title">
      CompressPro AI
    </text>

    <!-- Subtitle -->
    <text x="60" y="178" fill="#cbd5e1" font-size="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">
      Enterprise Multi-Engine Image, PDF &amp; Video Workspace
    </text>
    <text x="60" y="206" fill="#94a3b8" font-size="13" class="font-mono">
      Pillow • PyMuPDF • FFmpeg v7.1 • Real Relational DB • WAL Engine
    </text>

    <!-- Badges Row -->
    <g transform="translate(60, 235)">
      <!-- Badge 1: Images -->
      <g transform="translate(0, 0)">
        <rect width="135" height="34" rx="8" fill="#15102a" stroke="#6366f1" stroke-width="1.2"/>
        <text x="14" y="22" fill="#a5b4fc" font-size="12" class="font-mono" font-weight="600">🖼️ Image 40/40</text>
      </g>
      <!-- Badge 2: PDF -->
      <g transform="translate(148, 0)">
        <rect width="125" height="34" rx="8" fill="#15102a" stroke="#ec4899" stroke-width="1.2"/>
        <text x="14" y="22" fill="#f472b6" font-size="12" class="font-mono" font-weight="600">📄 PDF 40/40</text>
      </g>
      <!-- Badge 3: Video -->
      <g transform="translate(286, 0)">
        <rect width="135" height="34" rx="8" fill="#15102a" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="14" y="22" fill="#c084fc" font-size="12" class="font-mono" font-weight="600">🎬 Video 40/40</text>
      </g>
      <!-- Badge 4: Database -->
      <g transform="translate(434, 0)">
        <rect width="155" height="34" rx="8" fill="#15102a" stroke="#10b981" stroke-width="1.2"/>
        <text x="14" y="22" fill="#6ee7b7" font-size="12" class="font-mono" font-weight="600">🗄️ Real DB (WAL)</text>
      </g>
    </g>

    <!-- Bottom Feature Line -->
    <text x="60" y="320" fill="#64748b" font-size="12" class="font-mono">
      ✓ Zero-Trust Ingestion  •  ✓ Dual Verification Gate  •  ✓ 280-Case Test Specification
    </text>
  </g>

  <!-- RIGHT COLUMN: TELEMETRY CARD (Strict absolute placement x=760 to x=1140, NEVER overlaps!) -->
  <g>
    <!-- Background Card -->
    <rect x="760" y="55" width="380" height="265" rx="16" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <!-- Terminal Header Bar -->
    <path d="M 760 71 C 760 62 767 55 776 55 L 1124 55 C 1133 55 1140 62 1140 71 L 1140 95 L 760 95 Z" fill="#201842" opacity="0.8"/>
    <circle cx="784" cy="75" r="5" fill="#ec4899"/>
    <circle cx="800" cy="75" r="5" fill="#eab308"/>
    <circle cx="816" cy="75" r="5" fill="#10b981"/>
    <text x="834" y="79" fill="#c4b5fd" font-size="11" class="font-mono">system_telemetry.json</text>

    <!-- Terminal Key-Value Rows -->
    <g class="font-mono" font-size="12.5">
      <!-- Row 1 -->
      <text x="785" y="132" fill="#94a3b8">ENGINE:</text>
      <text x="940" y="132" fill="#38bdf8" font-weight="700">FastAPI + Async</text>

      <!-- Row 2 -->
      <text x="785" y="165" fill="#94a3b8">DATABASE:</text>
      <text x="940" y="165" fill="#34d399" font-weight="700">SQLite / Postgres</text>

      <!-- Row 3 -->
      <text x="785" y="198" fill="#94a3b8">STATE MACHINE:</text>
      <text x="940" y="198" fill="#c084fc" font-weight="700">Deterministic</text>

      <!-- Row 4 -->
      <text x="785" y="231" fill="#94a3b8">SECURITY:</text>
      <text x="940" y="231" fill="#f472b6" font-weight="700">Zero-Trust / Magic</text>

      <!-- Row 5 -->
      <text x="785" y="264" fill="#94a3b8">VERIFICATION:</text>
      <text x="940" y="264" fill="#fbbf24" font-weight="700">2-Pass Probe Gate</text>

      <!-- Row 6 -->
      <text x="785" y="295" fill="#94a3b8">STORAGE:</text>
      <text x="940" y="295" fill="#a78bfa" font-weight="700">Sandboxed Vault</text>
    </g>
  </g>
</svg>
