<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroGlow" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070510" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f0c1e" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c4b5fd"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes shimmerLaser {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .pulsing-bg {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .laser-line {
      animation: shimmerLaser 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .floating-card {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .rotating-disc {
      transform-origin: 1050px 210px;
      animation: rotateRing 20s linear infinite;
    }
    .text-title {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: -1.5px;
    }
    .text-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="#070510" rx="20"/>
  <rect width="1200" height="420" fill="url(#heroGlow)" rx="20" class="pulsing-bg"/>

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.12" stroke="#a78bfa" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Outer Border with Neon Accent -->
  <rect x="2" y="2" width="1196" height="416" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Laser Beam Sweeper -->
  <g clip-path="url(#borderClip)">
    <rect x="0" y="0" width="600" height="4" fill="url(#laserGrad)" class="laser-line"/>
  </g>

  <!-- Rotating Geometric Compass (Right Side Accent) -->
  <g class="rotating-disc" opacity="0.18">
    <circle cx="1050" cy="210" r="140" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="1050" cy="210" r="100" fill="none" stroke="#ec4899" stroke-width="2"/>
    <polygon points="1050,90 1065,210 1050,330 1035,210" fill="#8b5cf6" opacity="0.3"/>
    <polygon points="930,210 1050,225 1170,210 1050,195" fill="#ec4899" opacity="0.3"/>
  </g>

  <!-- Left Content: Logo & Branding -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill: Status -->
    <g transform="translate(0, 0)">
      <rect width="320" height="32" rx="16" fill="#1b1536" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="16" cy="16" r="4.5" fill="#34d399" filter="url(#neonGlow)"/>
      <text x="28" y="21" fill="#c4b5fd" font-size="12" class="text-mono" font-weight="600" letter-spacing="0.5">
        PRODUCTION BASELINE • V1.0 ACTIVE
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" fill="url(#titleGrad)" font-size="54" class="text-title" filter="url(#dropShadow)">
      CompressPro AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="135" fill="#94a3b8" font-size="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400">
      Enterprise Multi-Engine Image, PDF &amp; Video Workspace
    </text>
    <text x="0" y="160" fill="#cbd5e1" font-size="14" class="text-mono" opacity="0.8">
      Pillow • PyMuPDF • FFmpeg v7.1 • Real Relational DB • WAL Engine
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: Images -->
      <g transform="translate(0, 0)">
        <rect width="125" height="34" rx="10" fill="#15102a" stroke="#6366f1" stroke-width="1.2"/>
        <text x="16" y="22" fill="#a5b4fc" font-size="12" class="text-mono" font-weight="600">🖼️ Image 40/40</text>
      </g>
      <!-- Badge 2: PDF -->
      <g transform="translate(135, 0)">
        <rect width="120" height="34" rx="10" fill="#15102a" stroke="#ec4899" stroke-width="1.2"/>
        <text x="16" y="22" fill="#f472b6" font-size="12" class="text-mono" font-weight="600">📄 PDF 40/40</text>
      </g>
      <!-- Badge 3: Video -->
      <g transform="translate(265, 0)">
        <rect width="130" height="34" rx="10" fill="#15102a" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="16" y="22" fill="#c084fc" font-size="12" class="text-mono" font-weight="600">🎬 Video 40/40</text>
      </g>
      <!-- Badge 4: Database -->
      <g transform="translate(405, 0)">
        <rect width="150" height="34" rx="10" fill="#15102a" stroke="#10b981" stroke-width="1.2"/>
        <text x="16" y="22" fill="#6ee7b7" font-size="12" class="text-mono" font-weight="600">🗄️ Real DB (WAL)</text>
      </g>
    </g>
  </g>

  <!-- Floating Stats Card (Hero Right Side) -->
  <g transform="translate(820, 95)" class="floating-card" filter="url(#dropShadow)">
    <rect width="300" height="230" rx="20" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Card Header -->
    <path d="M 0 20 C 0 9 9 0 20 0 L 280 0 C 291 0 300 9 300 20 L 300 48 L 0 48 Z" fill="#251c4a" opacity="0.6"/>
    <circle cx="24" cy="24" r="6" fill="#ec4899"/>
    <circle cx="42" cy="24" r="6" fill="#eab308"/>
    <circle cx="60" cy="24" r="6" fill="#10b981"/>
    <text x="82" y="28" fill="#c4b5fd" font-size="11" class="text-mono">system_telemetry.json</text>

    <!-- Card Content -->
    <g transform="translate(24, 75)" class="text-mono" font-size="12">
      <text x="0" y="0" fill="#94a3b8">ENGINE:</text>
      <text x="130" y="0" fill="#38bdf8" font-weight="700">FastAPI + Async</text>

      <text x="0" y="28" fill="#94a3b8">DATABASE:</text>
      <text x="130" y="28" fill="#34d399" font-weight="700">SQLite / Postgres</text>

      <text x="0" y="56" fill="#94a3b8">STATE MACHINE:</text>
      <text x="130" y="56" fill="#a78bfa" font-weight="700">Deterministic</text>

      <text x="0" y="84" fill="#94a3b8">SECURITY:</text>
      <text x="130" y="84" fill="#f472b6" font-weight="700">Zero-Trust / Magic</text>

      <text x="0" y="112" fill="#94a3b8">VERIFICATION:</text>
      <text x="130" y="112" fill="#fbbf24" font-weight="700">2-Pass Probe Gate</text>
    </g>
  </g>
</svg>
