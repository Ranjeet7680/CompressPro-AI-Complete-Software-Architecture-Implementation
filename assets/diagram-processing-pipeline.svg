<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <radialGradient id="pipeBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#120c24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06050b" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="stepHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="neonPip" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes marchLine {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pulseGate {
      0%, 100% { stroke-width: 1.5; stroke: #34d399; }
      50% { stroke-width: 3.5; stroke: #10b981; }
    }
    .flow-line {
      stroke-dasharray: 6 6;
      animation: marchLine 1.2s linear infinite;
    }
    .pulsing-border {
      animation: pulseGate 2s ease-in-out infinite;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .text-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

  <!-- Background -->
  <rect width="1100" height="320" fill="url(#pipeBg)" rx="16" stroke="#221b3d" stroke-width="2"/>

  <!-- Section Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="0" fill="#ffffff" font-size="18" class="text-sans" font-weight="800">
      ZERO-TRUST MEDIA PROCESSING PIPELINE &amp; DUAL VERIFICATION GATE
    </text>
    <text x="0" y="20" fill="#94a3b8" font-size="11" class="text-mono">
      Every payload is untrusted • Sandboxed processing • Verified before committing state
    </text>
  </g>

  <!-- Connecting Stream Line -->
  <line x1="160" y1="165" x2="950" y2="165" stroke="#8b5cf6" stroke-width="3" class="flow-line"/>

  <!-- STAGE 1: INGESTION -->
  <g transform="translate(40, 85)">
    <rect width="175" height="180" rx="12" fill="#130f26" stroke="#6366f1" stroke-width="1.5"/>
    <rect width="175" height="30" rx="12" fill="#1e1842"/>
    <circle cx="16" cy="15" r="4" fill="#6366f1" filter="url(#neonPip)"/>
    <text x="28" y="19" fill="#c7d2fe" font-size="10" class="text-mono" font-weight="700">STAGE 1: INGEST</text>
    
    <g transform="translate(12, 45)" class="text-mono" font-size="10" fill="#cbd5e1">
      <text x="0" y="15">• Magic Byte Sniffing</text>
      <text x="0" y="32">• No Ext Trust</text>
      <text x="0" y="49">• Preflight Size Cap</text>
      <text x="0" y="66">• Decompression Bomb</text>
      <text x="0" y="83">  Guard (&lt;100M px)</text>
      <rect x="0" y="96" width="150" height="20" rx="5" fill="#312e81" opacity="0.6"/>
      <text x="75" y="110" fill="#a5b4fc" text-anchor="middle" font-size="9">Quarantine Storage</text>
    </g>
  </g>

  <!-- STAGE 2: PREPARATION & SANDBOX -->
  <g transform="translate(255, 85)">
    <rect width="175" height="180" rx="12" fill="#130f26" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="175" height="30" rx="12" fill="#1e1842"/>
    <circle cx="16" cy="15" r="4" fill="#8b5cf6" filter="url(#neonPip)"/>
    <text x="28" y="19" fill="#e9d5ff" font-size="10" class="text-mono" font-weight="700">STAGE 2: SANDBOX</text>
    
    <g transform="translate(12, 45)" class="text-mono" font-size="10" fill="#cbd5e1">
      <text x="0" y="15">• Isolated Temp Dir</text>
      <text x="0" y="32">• Non-Root Execution</text>
      <text x="0" y="49">• Strict Timeouts</text>
      <text x="0" y="66">• Safe Arg Construction</text>
      <text x="0" y="83">  (No shell=True)</text>
      <rect x="0" y="96" width="150" height="20" rx="5" fill="#4c1d95" opacity="0.6"/>
      <text x="75" y="110" fill="#c084fc" text-anchor="middle" font-size="9">Worker Claim Lease</text>
    </g>
  </g>

  <!-- STAGE 3: TRANSFORMATION -->
  <g transform="translate(470, 85)">
    <rect width="175" height="180" rx="12" fill="#130f26" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="175" height="30" rx="12" fill="#1e1842"/>
    <circle cx="16" cy="15" r="4" fill="#ec4899" filter="url(#neonPip)"/>
    <text x="28" y="19" fill="#fbcfe8" font-size="10" class="text-mono" font-weight="700">STAGE 3: EXECUTE</text>
    
    <g transform="translate(12, 45)" class="text-mono" font-size="10" fill="#cbd5e1">
      <text x="0" y="15">• Pillow (Image)</text>
      <text x="0" y="32">• PyMuPDF (PDF)</text>
      <text x="0" y="49">• FFmpeg v7.1 (Video)</text>
      <text x="0" y="66">• Strips GPS EXIF</text>
      <text x="0" y="83">• Progressive Events</text>
      <rect x="0" y="96" width="150" height="20" rx="5" fill="#831843" opacity="0.6"/>
      <text x="75" y="110" fill="#f472b6" text-anchor="middle" font-size="9">Live Progress 0-100%</text>
    </g>
  </g>

  <!-- STAGE 4: VERIFICATION GATE (HIGHLIGHTED) -->
  <g transform="translate(685, 85)">
    <rect width="175" height="180" rx="12" fill="#0d1f18" stroke="#10b981" stroke-width="2" class="pulsing-border"/>
    <rect width="175" height="30" rx="12" fill="#064e3b"/>
    <circle cx="16" cy="15" r="4" fill="#34d399" filter="url(#neonPip)"/>
    <text x="28" y="19" fill="#a7f3d0" font-size="10" class="text-mono" font-weight="700">STAGE 4: VERIFY</text>
    
    <g transform="translate(12, 45)" class="text-mono" font-size="10" fill="#d1fae5">
      <text x="0" y="15">• Re-Decode Probe</text>
      <text x="0" y="32">• Dimension Match</text>
      <text x="0" y="49">• Duration Drift Check</text>
      <text x="0" y="66">• Valid Playable Stream</text>
      <text x="0" y="83">• Non-Zero Bytes</text>
      <rect x="0" y="96" width="150" height="20" rx="5" fill="#047857" opacity="0.8"/>
      <text x="75" y="110" fill="#ffffff" text-anchor="middle" font-size="9" font-weight="700">✓ Gate Approval</text>
    </g>
  </g>

  <!-- STAGE 5: COMMIT & PERSIST -->
  <g transform="translate(895, 85)">
    <rect width="165" height="180" rx="12" fill="#130f26" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="165" height="30" rx="12" fill="#1e1842"/>
    <circle cx="16" cy="15" r="4" fill="#f59e0b" filter="url(#neonPip)"/>
    <text x="28" y="19" fill="#fef3c7" font-size="10" class="text-mono" font-weight="700">STAGE 5: COMMIT</text>
    
    <g transform="translate(12, 45)" class="text-mono" font-size="10" fill="#cbd5e1">
      <text x="0" y="15">• Vault Artifact Write</text>
      <text x="0" y="32">• SHA-256 Checksum</text>
      <text x="0" y="49">• Real DB Row Write</text>
      <text x="0" y="66">• Temp Workspace Wipe</text>
      <text x="0" y="83">• Download Token Mint</text>
      <rect x="0" y="96" width="140" height="20" rx="5" fill="#78350f" opacity="0.6"/>
      <text x="70" y="110" fill="#fde68a" text-anchor="middle" font-size="9">SUCCEEDED State</text>
    </g>
  </g>
</svg>
