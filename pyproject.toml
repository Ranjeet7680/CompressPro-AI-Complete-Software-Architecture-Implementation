[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compresspro-ai"
version = "1.0.0"
description = "CompressPro AI - Complete Image, PDF, and Video Workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "Pillow>=10.0.0",
    "pypdf>=3.0.0",
    "pymupdf>=1.23.0",
    "imageio-ffmpeg>=0.4.9",
    "python-multipart>=0.0.6",
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "workers*"]
exclude = ["assets*", "public*", "tests*", "docs*", "storage_vault*", "packages*", "api*"]
